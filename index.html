<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Todo List</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="container">
			<header>
				<img src="./imgs/todo.png" alt="todo" />
				<h1>Todo List</h1>
			</header>
			<div class="sidebar">
				<div class="sidebar_projects">
					<h2>Projects</h2>
					<img src="./imgs/edit.png" alt="edit" class="project_edit" />
				</div>
				<div class="todoLists">
					<div class="todoList">
						<img src="./imgs/todolist.png" alt="todo_list" />
						<p class="todoProjectName">lq</p>
						<div class="todoList_imgs">
							<img src="./imgs/edit.png" alt="edit" class="todoList_edit" />
							<img src="./imgs/trash.png" alt="trash" class="todoList_trash" />
						</div>
					</div>
					<div class="todoList">
						<img src="./imgs/todolist.png" alt="todo_list" />
						<p class="todoProjectName">rq</p>
						<div class="todoList_imgs">
							<img src="./imgs/edit.png" alt="edit" class="todoList_edit" />
							<img src="./imgs/trash.png" alt="trash" class="todoList_trash" />
						</div>
					</div>
					<div class="todoList">
						<img src="./imgs/todolist.png" alt="todo_list" />
						<p class="todoProjectName">oq</p>
						<div class="todoList_imgs">
							<img src="./imgs/edit.png" alt="edit" class="todoList_edit" />
							<img src="./imgs/trash.png" alt="trash" class="todoList_trash" />
						</div>
					</div>
				</div>
			</div>
			<main>
				<form id="project_form" class="hidden">
					<input
						type="text"
						name="project"
						id="project"
						placeholder="project name"
						required
					/>
					<button type="submit">OK</button>
					<button type="button" class="project_cancel">Cancel</button>
				</form>
				<div class="projectName">
					<p class="project_name">l1</p>
					<p class="project_toggle">+</p>
				</div>
				<div class="tasks">
					<div class="task">
						<div class="taskDiv">
							<p class="title">11111111111</p>
							<p class="description">123</p>
						</div>
						<div>
							<p class="dueDate">11-11-11111</p>
						</div>
						<div>
							<p class="priority">low</p>
						</div>
						<div class="task_icons">
							<img src="./imgs/edit.png" alt="edit" class="edit_btn" />
							<img src="./imgs/trash.png" alt="trash" class="trash_btn" />
						</div>
					</div>
					<div class="task">
						<div>
							<p>11111111111</p>
							<p>123</p>
						</div>
						<div>
							<p>11-11-11111</p>
						</div>
						<div>
							<p>low</p>
						</div>
						<div class="task_icons">
							<img src="./imgs/edit.png" alt="edit" class="edit_btn" />
							<img src="./imgs/trash.png" alt="trash" class="trash_btn" />
						</div>
					</div>
				</div>
				<p class="add_task">+Add Task</p>
				<form class="task_form hidden">
					<input
						type="text"
						name="title"
						id="title"
						placeholder="Title"
						required
					/>
					<input
						type="text"
						name="description"
						id="description"
						placeholder="Description"
						required
					/>
					<label for="priority">
						<select name="priority" id="priority" required>
							<option value="high">High</option>
							<option value="medium">Medium</option>
							<option value="low">Low</option>
						</select>
					</label>
					<label for="date">Due Date</label>
					<input type="date" type="date" id="date" name="date" required />
					<button type="submit">OK</button>
					<button type="button" class="task_cancel">Cancel</button>
				</form>
			</main>
			<footer>
				<p>Copyright © Hiro for the Odin Project</p>
			</footer>
		</div>
		<script src="script.js">
		</script>
	</body>
</html>
